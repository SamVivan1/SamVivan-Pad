<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="keyActive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Chassis -->
  <rect x="36" y="56" width="440" height="400" rx="48" fill="url(#bodyGrad)" stroke="#334155" stroke-width="6"/>
  <rect x="44" y="64" width="424" height="384" rx="40" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- RGB / Status Glow Bar on Top -->
  <rect x="76" y="90" width="360" height="12" rx="6" fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- Row 1 Keys -->
  <!-- Key 1 (Mode Switch - Violet) -->
  <rect x="76" y="130" width="76" height="110" rx="16" fill="#4c1d95" stroke="#7c3aed" stroke-width="3"/>
  <rect x="86" y="140" width="56" height="80" rx="10" fill="#6d28d9"/>
  <circle cx="114" cy="180" r="12" fill="#fff" opacity="0.9"/>

  <!-- Key 2 -->
  <rect x="170" y="130" width="76" height="110" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <rect x="180" y="140" width="56" height="80" rx="10" fill="url(#keyGrad)"/>

  <!-- Key 3 (Active Blue) -->
  <rect x="264" y="130" width="76" height="110" rx="16" fill="#1e3a8a" stroke="#3b82f6" stroke-width="3"/>
  <rect x="274" y="140" width="56" height="80" rx="10" fill="url(#keyActive)"/>

  <!-- Key 4 -->
  <rect x="358" y="130" width="76" height="110" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <rect x="368" y="140" width="56" height="80" rx="10" fill="url(#keyGrad)"/>

  <!-- Row 2 Keys -->
  <!-- Key 5 -->
  <rect x="76" y="270" width="76" height="110" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <rect x="86" y="280" width="56" height="80" rx="10" fill="url(#keyGrad)"/>

  <!-- Key 6 -->
  <rect x="170" y="270" width="76" height="110" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <rect x="180" y="280" width="56" height="80" rx="10" fill="url(#keyGrad)"/>

  <!-- Key 7 -->
  <rect x="264" y="270" width="76" height="110" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <rect x="274" y="280" width="56" height="80" rx="10" fill="url(#keyGrad)"/>

  <!-- Key 8 -->
  <rect x="358" y="270" width="76" height="110" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <rect x="368" y="280" width="56" height="80" rx="10" fill="url(#keyGrad)"/>

  <!-- Bottom Brand Text -->
  <text x="256" y="420" font-family="monospace" font-size="16" font-weight="bold" fill="#64748b" text-anchor="middle" letter-spacing="4">SAMVIVAN PAD</text>
</svg>
